<!doctype html>
<!-- Pixelfart · Pixelvanger (voorbeeldgame) · code: GPL-3.0-or-later · graphics & geluid: CC BY-SA 4.0 -->
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixelvanger</title>
<script src="pixelfart.js"></script>
<script type="application/json" id="pixelfart">
{
	"title": "Pixelvanger",
	"code": "VANGR",
	"version": "1.1.0",
	"description": "Vang de vallende pixels met je bakje. Mis je er drie, dan is het game over.",
	"categories": ["Arcade", "Snel"],
	"age": "ALL",
	"author": "",
	"changelog": "Pixelfonts en scherpe tekst.",
	"score": { "order": "desc", "label": "punten" }
}
</script>
<style>
	/* Het hele venster is van de game; het canvas wordt door Pixelfart.fit() geschaald. */
	html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
	body { display: grid; place-items: center; }
	canvas { image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="game" width="160" height="120" aria-label="Pixelvanger"></canvas>
<script>
(() => {
	'use strict';
	const W = 160, H = 120;                 // vaste lage resolutie: echte pixels
	const cv = document.getElementById('game');
	const g = cv.getContext('2d');
	Pixelfart.fit(cv, { mode: 'integer' });  // schermvullend, scherp, ook bij draaien/fullscreen

	// ---------- toestand ----------
	let state = 'title';                     // title | play | over
	let bak, drops, score, lives, spawn, best = Pixelfart.store.get('best', 0);
	const keys = new Set();
	let pointerX = null;

	function reset() {
		bak = { x: W / 2 - 10, w: 20 };
		drops = []; score = 0; lives = 3; spawn = 0;
	}

	// ---------- invoer: toetsenbord, muis en aanraken ----------
	addEventListener('keydown', (e) => {
		keys.add(e.key);
		if ((e.key === ' ' || e.key === 'Enter') && state !== 'play') start();
		if (e.key === 'Escape') Pixelfart.back();
	});
	addEventListener('keyup', (e) => keys.delete(e.key));
	const toGame = (e) => { const r = cv.getBoundingClientRect(); return ((e.clientX - r.left) / r.width) * W; };
	cv.addEventListener('pointerdown', (e) => { if (state !== 'play') start(); pointerX = toGame(e); });
	cv.addEventListener('pointermove', (e) => { if (e.buttons || e.pointerType === 'touch') pointerX = toGame(e); });
	addEventListener('pointerup', () => { pointerX = null; });

	function start() { reset(); state = 'play'; }

	function gameOver() {
		state = 'over';
		if (score > best) { best = score; Pixelfart.store.set('best', best); }
		Pixelfart.score(score);              // eindscore naar de site (één keer per potje)
	}

	// Muziek of timers zou je hier stilzetten; de loop pauzeert zelf.
	Pixelfart.onPause(() => keys.clear());

	// ---------- spel ----------
	function update(dt) {
		if (state !== 'play') return;
		const speed = 90;
		if (keys.has('ArrowLeft') || keys.has('a')) bak.x -= speed * dt;
		if (keys.has('ArrowRight') || keys.has('d')) bak.x += speed * dt;
		if (pointerX !== null) bak.x += (pointerX - bak.w / 2 - bak.x) * Math.min(1, dt * 12);
		bak.x = Math.max(0, Math.min(W - bak.w, bak.x));

		spawn -= dt;
		if (spawn <= 0) {
			drops.push({ x: 4 + Math.random() * (W - 8), y: -4, v: 30 + Math.min(score, 60) });
			spawn = Math.max(0.35, 1.1 - score * 0.02);
		}
		for (const d of drops) d.y += d.v * dt;
		drops = drops.filter((d) => {
			if (d.y > H - 12 && d.y < H - 6 && d.x > bak.x - 2 && d.x < bak.x + bak.w + 2) { score++; return false; }
			if (d.y > H) { lives--; return false; }
			return true;
		});
		if (lives <= 0) gameOver();
	}

	// Pixelfart-palet (zie de skill). Eigen kleuren mogen ook, maar houd het bij een handvol.
	const C = { zwart: '#000000', wit: '#f2f2f2', grijs: '#8a8a8a', groen: '#5dde7a', geel: '#ffcf4a', roze: '#ff5c8a' };
	const BIG = '8px "Press Start 2P"', SMALL = '8px Tiny5';  // pixelfonts op hun eigen maat: scherp

	// Haarscherpe tekst (geen wazige randjes) via de SDK.
	const text = (s, x, y, c = C.wit, font = BIG) => { g.font = font; g.fillStyle = c; Pixelfart.text(g, s, x, y); };

	function draw() {
		g.fillStyle = C.zwart; g.fillRect(0, 0, W, H);
		g.textBaseline = 'top'; g.textAlign = 'left';
		if (state === 'title') {
			g.textAlign = 'center';
			text('PIXELVANGER', W / 2, 36, C.geel);
			text('pijltjes of slepen', W / 2, 60, C.wit, SMALL);
			text('spatie / tik = start', W / 2, 72, C.groen, SMALL);
			if (best) text('record ' + best, W / 2, 96, C.grijs, SMALL);
			return;
		}
		// Alles op hele pixels (Math.round): geen halve, wazige pixels.
		g.fillStyle = C.groen;
		for (const d of drops) g.fillRect(Math.round(d.x) - 2, Math.round(d.y) - 2, 4, 4);
		g.fillStyle = C.wit;
		g.fillRect(Math.round(bak.x), H - 8, bak.w, 4);
		g.fillRect(Math.round(bak.x), H - 12, 2, 4);
		g.fillRect(Math.round(bak.x) + bak.w - 2, H - 12, 2, 4);
		text(String(score), 4, 4);
		g.fillStyle = C.roze;                    // levens als pixelblokjes
		for (let i = 0; i < lives; i++) g.fillRect(W - 10 - i * 8, 4, 6, 6);
		if (state === 'over') {
			g.fillStyle = C.zwart; g.fillRect(16, 36, W - 32, 56);   // vlak kader, geen doorzichtigheid
			g.textAlign = 'center';
			text('GAME OVER', W / 2, 44, C.roze);
			text(score + ' punten', W / 2, 62, C.wit, SMALL);
			text('spatie / tik = opnieuw', W / 2, 76, C.groen, SMALL);
		}
	}

	reset();
	// Eerst de fonts (canvas wacht daar niet zelf op), dan starten.
	Pixelfart.fonts(['Press Start 2P', 'Tiny5']).then(() => Pixelfart.loop(update, { fps: 60, draw }));
})();
</script>
</body>
</html>
