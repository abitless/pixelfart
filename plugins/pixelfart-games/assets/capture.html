<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; frame-src 'self' blob:; connect-src 'self' data: blob:; form-action 'none'; base-uri 'none'">
<meta name="robots" content="noindex">
<title>Pixelfart thumbnail</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style>
</head>
<body>
<script>
/*
 * Pixelfart: thumbnail-hulp op de game-origin (gemaakt door de plugin Pixelfart Games, niet bewerken).
 * wp-admin stuurt een game (code of HTML) en krijgt na een paar seconden een PNG van het grootste canvas terug.
 * Zo draait een game nooit binnen wp-admin.
 */
(() => {
	const SITE = '__SITE_ORIGIN__';
	let frame = null, blob = null;

	function clear() {
		if (frame) frame.remove();
		if (blob) URL.revokeObjectURL(blob);
		frame = blob = null;
	}

	function biggestCanvas(doc) {
		let best = null, area = 0;
		doc.querySelectorAll('canvas').forEach((cv) => {
			const r = cv.getBoundingClientRect();
			if (r.width > 0 && r.height > 0 && cv.width * cv.height > area) { best = cv; area = cv.width * cv.height; }
		});
		return best;
	}

	addEventListener('message', async (e) => {
		const d = e.data;
		if (e.origin !== SITE || !d || d.type !== 'pf-capture') return;
		const reply = (m) => e.source.postMessage(Object.assign({ type: 'pf-capture-result', id: d.id }, m), e.origin);

		clear();
		let src;
		if (typeof d.html === 'string') {
			blob = URL.createObjectURL(new Blob([d.html], { type: 'text/html' }));
			src = blob;
		} else if (/^[A-Z]{5}$/.test(d.code || '')) {
			src = '../' + d.code + '/game.html?capture=' + Date.now();
		} else {
			return reply({ error: 'bad-request' });
		}
		frame = document.createElement('iframe');
		frame.src = src;
		document.body.appendChild(frame);

		await new Promise((r) => setTimeout(r, Math.min(10000, Math.max(500, +d.wait || 3200))));
		let data = null, w = 0, h = 0;
		try {
			const cv = biggestCanvas(frame.contentDocument);
			if (cv) { data = cv.toDataURL('image/png'); w = cv.width; h = cv.height; }
		} catch (err) { /* canvas 'tainted' of geen toegang */ }
		clear(); // game stoppen: scheelt stroom
		reply({ data, w, h });
	});
	parent.postMessage({ type: 'pf-capture-ready' }, SITE);
})();
</script>
</body>
</html>
