    + 'Klaar? Stuur dit HTML-bestand naar Pixelfart. (klik om te verbergen)');
  if (document.body) intro(); else addEventListener('DOMContentLoaded', intro);
  return {
    inSite: false,
    get paused() { return document.hidden; },
    fit(cv, o = {}) {
      const go = () => {
        let s = Math.min(innerWidth / cv.width, innerHeight / cv.height);
        if (o.mode === 'integer' && s >= 1) s = Math.floor(s);
        cv.style.width = Math.floor(cv.width * s) + 'px'; cv.style.height = Math.floor(cv.height * s) + 'px';
      };
      cv.style.imageRendering = 'pixelated'; addEventListener('resize', go); go(); return go;
    },
    loop(update, o = {}) {
      let last = 0, raf = 0, on = true; const gap = 1000 / (o.fps || 60) - 1;
      const frame = (t) => {
        raf = 0; if (!on || document.hidden) return; raf = requestAnimationFrame(frame);
        if (last && t - last < gap) return;
        const dt = last ? Math.min((t - last) / 1000, 0.1) : 0; last = t; update(dt); if (o.draw) o.draw();
      };
      const go = () => { if (!raf && on && !document.hidden) { last = 0; raf = requestAnimationFrame(frame); } };
      onR.push(go); go();
      return { stop() { on = false; cancelAnimationFrame(raf); raf = 0; }, start() { on = true; go(); } };
    },
    onPause: (f) => onP.push(f), onResume: (f) => onR.push(f),
    fonts: () => Promise.resolve(),
    text: (c, s, x, y) => c.fillText(s, Math.round(x), Math.round(y)),
    score(n) { note('TESTVERSIE · Score ' + Math.floor(n) + ': online vraagt de site nu om 3 letters voor de topscorelijst.'); },
    back() { note('TESTVERSIE · Online ga je nu terug naar pixelfart.nl.'); },
    store: {
      get(k, d) { try { const v = localStorage.getItem('pf:' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
      set(k, v) { try { localStorage.setItem('pf:' + k, JSON.stringify(v)); } catch (e) {} },

})();

(()=>{
const W=256,H=144,GROUND=126,SCROLL=34;
const cv=document.getElementById('c'),g=cv.getContext('2d');
g.imageSmoothingEnabled=false;
function fit(){const aw=innerWidth-32,ah=innerHeight-32;let S=Math.min(aw/W,ah/H);if(S>=1)S=Math.floor(S);cv.style.width=W*S+'px';cv.style.height=H*S+'px'}
addEventListener('resize',fit);fit();
const touch=matchMedia('(pointer:coarse)').matches;

// palet
const C={'.':null,k:'#120d1c',w:'#f4e9d8',o:'#ff9f43',y:'#ffd56b',r:'#e8466b',d:'#8f2449',p:'#5b3a7a',l:'#8a7a9c',g:'#4ec9a6',G:'#22806a',b:'#7fd4ff',B:'#3a6fd8',m:'#2a1f3a',n:'#3d2c52',h:'#174f43'};
function sprite(rows,swap={}){const w=Math.max(...rows.map(r=>r.length));const c=document.createElement('canvas');c.width=w;c.height=rows.length;const x=c.getContext('2d');rows.forEach((r,j)=>[...r].forEach((ch,i)=>{ch=swap[ch]||ch;if(C[ch]){x.fillStyle=C[ch];x.fillRect(i,j,1,1)}}));return c}
function whiten(c){const o=document.createElement('canvas');o.width=c.width;o.height=c.height;const x=o.getContext('2d');x.drawImage(c,0,0);x.globalCompositeOperation='source-in';x.fillStyle='#fff';x.fillRect(0,0,o.width,o.height);return o}
const HELI=[
 '...........kkk..........',
 '........hhhhhhhhh.......',
 '......hhGGGGGGGGGbb.....',
 'hh...hGGGGGGGGGGGbbbb...',
 'hGGGGGGGgGGGGGGGGGbbbG..',
 '.hGGGGGGGGGGGGGGGGGGGGG.',
 '.......hGGGGGGGGGGGGGh..',
 '........k.........k.....',
 '.....kkkkkkkkkkkkkkkkk..'];
const SP={
 heli:sprite(HELI),
 boss:sprite(HELI,{h:'d',G:'r',g:'o',b:'y'}),
 tank:sprite([
  '.....nnnn.....',
  '..lllnnnnlll..',
  '.pppppppppppp.',
  'pppppppppppppp',
  'kmkkmkkmkkmkkm',
  '.kkkkkkkkkkkk.']),
 jeep:sprite([
  '....ww....',
  '..ppppp...',
  '.pppppppp.',
  'pppppppppp',
  '.kk....kk.']),
 drone:[sprite([
  'll......ll',
  '.l.rrrr.l.',
  '..rryyrr..',
  '...rrrr...',
  '....kk....']),sprite([
  '..........',
  'lll.rrrr.lll',
  '..rryyrr..',
  '...rrrr...',
  '....kk....'])],
 heart:sprite(['.r.r.','rrrrr','rrrrr','.rrr.','..r..']),
 heart0:sprite(['.n.n.','nnnnn','nnnnn','.nnn.','..n..']),
 crate:sprite(['oooooo','oyoyyo','ooyyoo','oyyoyo','oooooo']),
 med:sprite(['wwwww','wwrww','wrrrw','wwrww','wwwww']),
};
const WHITE={tank:whiten(SP.tank),jeep:whiten(SP.jeep),drone:SP.drone.map(whiten),boss:whiten(SP.boss)};

// achtergrondlagen (tegelbaar, 256 breed)
function layer(fn){const c=document.createElement('canvas');c.width=W;c.height=H;fn(c.getContext('2d'));return c}
const sky=layer(x=>{['#1b1230','#26163d','#3a1a4a','#5a2150','#8a2a52','#c23f4e','#e8664a','#ff9f43'].forEach((c,i)=>{x.fillStyle=c;x.fillRect(0,i*12,W,12)});
 x.fillStyle='#ffd56b';for(let j=0;j<18;j++){const w=Math.round(Math.sqrt(18*18-(j-18)**2)*1.1);if(j%3!==2)x.fillRect(180-w,74+j,w*2,1)}});
const far=layer(x=>{let sx=0;x.fillStyle='#3d2c52';while(sx<W){const w=8+(sx*7%13),h=16+(sx*13%30);x.fillRect(sx,GROUND-h,w,h);sx+=w+1}});
const near=layer(x=>{let sx=3;while(sx<W){const w=7+(sx*5%9),h=8+(sx*11%20);x.fillStyle='#2a1f3a';x.fillRect(sx,GROUND-h,w,h);
  x.fillStyle='#ffd56b';for(let wy=GROUND-h+3;wy<GROUND-3;wy+=4)if((wy+sx)%3===0)x.fillRect(sx+2,wy,1,1);sx+=w+5}
 x.fillStyle='#120d1c';x.fillRect(0,GROUND,W,H-GROUND);x.fillStyle='#3d2c52';x.fillRect(0,GROUND,W,1);for(let i=0;i<W;i+=6)x.fillRect(i,GROUND+4,3,1)});
const clouds=[...Array(6)].map((_,i)=>({x:i*50,y:10+((i*37)%40),w:16+((i*13)%20)}));

// Geluid aan/uit: luidsprekerknop in beeld en toets M. Standaard aan, keuze onthouden.
const pfSound = (() => {
  let muted = !!PF.store.get('muted', false);
  const b = document.createElement('button');
  b.type = 'button';
  b.style.cssText = 'position:fixed;z-index:60;right:8px;bottom:8px;width:34px;height:34px;padding:3px;border:0;background:#000;'
    + 'box-shadow:0 0 0 3px #6a6a6a;cursor:pointer;touch-action:manipulation;line-height:0';
  const icon = (m) => '<svg viewBox="0 0 9 8" width="28" height="25" shape-rendering="crispEdges" fill="#f2f2f2" aria-hidden="true">'
    + '<path d="M0 3h2v2H0zM2 2h1v4H2zM3 1h1v6H3z"/>'
    + (m ? '<path fill="#ff5c8a" d="M5 2h1v1H5zM8 2h1v1H8zM6 3h2v2H6zM5 5h1v1H5zM8 5h1v1H8z"/>'
         : '<path d="M5 3h1v2H5zM7 1h1v1H7zM8 2h1v4H8zM7 6h1v1H7z"/>') + '</svg>';
  const show = () => { b.innerHTML = icon(muted); b.title = muted ? 'Geluid aan (M)' : 'Geluid uit (M)'; b.setAttribute('aria-label', b.title); b.setAttribute('aria-pressed', String(muted)); };
  const set = (m) => { muted = m; PF.store.set('muted', m); show(); if (pfSound.onChange) pfSound.onChange(m); };
  b.addEventListener('pointerdown', (e) => e.stopPropagation());
  b.addEventListener('click', (e) => { e.stopPropagation(); set(!muted); b.blur(); });
  addEventListener('keydown', (e) => { if (e.code === 'KeyM' && !e.repeat && !/INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName)) set(!muted); });
  show();
  (document.body ? Promise.resolve() : new Promise((r) => addEventListener('DOMContentLoaded', r))).then(() => document.body.appendChild(b));
  return { get muted() { return muted; }, onChange: null };
})();
// geluid
let ac=null,rotorGain=null;
PF.onPause(()=>{if(ac)ac.suspend()});PF.onResume(()=>{if(ac&&!pfSound.muted)ac.resume()});
function audio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),lfo=ac.createOscillator(),lg=ac.createGain(),f=ac.createBiquadFilter();rotorGain=ac.createGain();
  o.type='sawtooth';o.frequency.value=55;lfo.frequency.value=14;lg.gain.value=.5;f.type='lowpass';f.frequency.value=180;rotorGain.gain.value=0;
  const am=ac.createGain();am.gain.value=.5;lfo.connect(lg).connect(am.gain);o.connect(f).connect(am).connect(rotorGain).connect(ac.destination);o.start();lfo.start()}catch(e){}}
 if(ac&&ac.state==='suspended')ac.resume()}
function beep(f1,f2,dur,vol,type='square'){if(!ac||pfSound.muted)return;const o=ac.createOscillator(),q=ac.createGain();o.type=type;o.frequency.setValueAtTime(f1,ac.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),ac.currentTime+dur);q.gain.setValueAtTime(vol,ac.currentTime);q.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);o.connect(q).connect(ac.destination);o.start();o.stop(ac.currentTime+dur)}
function crunch(dur,vol){if(!ac||pfSound.muted)return;const n=ac.createBufferSource(),b=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate),d=b.getChannelData(0);let v=0;for(let i=0;i<d.length;i++){if(i%40===0)v=Math.random()*2-1;d[i]=v*(1-i/d.length)}n.buffer=b;const q=ac.createGain();q.gain.value=vol;n.connect(q).connect(ac.destination);n.start()}
function rotor(on){if(rotorGain)rotorGain.gain.setTargetAtTime(on&&!pfSound.muted?.05:0,ac.currentTime,.2)}

let best=0;try{best=+localStorage.getItem('hagel-heli-best')||0}catch(e){}
let state='title',P,bul,foes,shots,parts,shells,items,score,wave,mag,reload,cd,spawnLeft,spawnT,banner,shake,t=0,combo,comboT,scrollX=0,bossWave=false;
const MAG=100;
function reset(){P={x:40,y:50,vx:0,vy:0,hp:4,inv:0,tilt:0};bul=[];foes=[];shots=[];parts=[];shells=[];items=[];score=0;wave=0;mag=MAG;reload=0;cd=0;shake=0;combo=0;comboT=0;nextWave()}
function nextWave(){wave++;bossWave=wave%5===0;spawnLeft=bossWave?0:6+wave*3;spawnT=1.5;banner=2;if(bossWave)setTimeout(()=>{if(state==='play')spawnBoss()},1500)}

// invoer
const keys={};let aim={x:180,y:110},fire=false,stick=null;
addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowLeft','ArrowRight','ArrowDown'].includes(e.code))e.preventDefault();keys[e.code]=true;
 if(e.code==='KeyP'&&(state==='play'||state==='pause')){state=state==='play'?'pause':'play';rotor(state==='play')}
 if(e.code==='Enter'&&state!=='play')begin()});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;fire=false;stick=null;if(state==='play'){state='pause';rotor(false)}});
function toWorld(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
cv.addEventListener('pointerdown',e=>{audio();if(state==='title'||state==='over'){begin();return}if(state==='pause'){state='play';rotor(true);return}
 const p=toWorld(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}
 if(e.pointerType==='touch'&&p.x<W*.4&&!stick){stick={id:e.pointerId,ox:p.x,oy:p.y,dx:0,dy:0};return}
 aim=p;fire=e.pointerId;});
cv.addEventListener('pointermove',e=>{const p=toWorld(e);if(stick&&e.pointerId===stick.id){stick.dx=Math.max(-1,Math.min(1,(p.x-stick.ox)/18));stick.dy=Math.max(-1,Math.min(1,(p.y-stick.oy)/18))}else if(e.pointerType!=='touch'||fire===e.pointerId)aim=p});
function up(e){if(stick&&e.pointerId===stick.id)stick=null;if(fire===e.pointerId)fire=false}
addEventListener('pointerup',up);addEventListener('pointercancel',up);
function begin(){audio();reset();state='play';rotor(true);cv.focus()}
function startReload(){reload=1.4;beep(200,120,.08,.05)}

function puff(x,y,n,cols,sp=60){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=Math.random()*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-20,l:.3+Math.random()*.5,c:cols[i%cols.length]})}}
function spawn(){
 const r=Math.random();
 if(wave>=2&&r<.3)foes.push({k:'tank',x:W+4,y:GROUND-6,w:14,h:6,hp:14,max:14,v:-6,pts:60,f:0,hit:0,cd:2+Math.random()*2});
 else foes.push({k:'jeep',x:W+4,y:GROUND-5,w:10,h:5,hp:5,v:-34-wave*2,pts:20,f:0,hit:0,cd:2+Math.random()*1.5,burst:0});
}
function spawnBoss(){const hp=120+wave*20;foes.push({k:'boss',x:W+10,y:30,w:48,h:18,hp,max:hp,pts:1000,f:0,hit:0,cd:2,ph:0,mode:0});beep(110,55,.8,.08,'sawtooth')}
function hurt(dmg=1){if(P.inv>0)return;P.hp-=dmg;P.inv=1.4;shake=7;puff(P.x+12,P.y+5,16,['#e8466b','#f4e9d8','#ff9f43']);beep(400,60,.35,.08,'sawtooth');combo=0;
 if(P.hp<=0){state='over';PF.score(score);rotor(false);puff(P.x+12,P.y+5,60,['#e8466b','#ff9f43','#ffd56b','#22806a'],110);crunch(.8,.4);if(score>best){best=score;try{localStorage.setItem('hagel-heli-best',best)}catch(e){}}}}
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function aimShot(x,y,sp,spread=0){const a=Math.atan2(P.y+5-y,P.x+12-x)+spread;shots.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp})}

function update(dt){
 scrollX+=SCROLL*dt;
 // vliegen
 let mx=((keys.KeyD||keys.ArrowRight)?1:0)-((keys.KeyA||keys.ArrowLeft)?1:0),my=((keys.KeyS||keys.ArrowDown)?1:0)-((keys.KeyW||keys.ArrowUp)?1:0);
 if(stick){mx=stick.dx;my=stick.dy}
 P.vx+=mx*360*dt;P.vy+=my*360*dt;P.vx*=Math.pow(.04,dt);P.vy*=Math.pow(.04,dt);
 P.x+=P.vx*dt;P.y+=P.vy*dt+Math.sin(t*3)*.08;
 if(P.x<0){P.x=0;P.vx=0}if(P.x>W-24){P.x=W-24;P.vx=0}if(P.y<10){P.y=10;P.vy=0}
 if(P.y>GROUND-24){P.y=GROUND-24;P.vy=0}
 P.tilt+=((P.vx/90)*.25-P.tilt)*Math.min(1,dt*8);
 P.inv=Math.max(0,P.inv-dt);
 const gx=P.x+15,gy=P.y+8,ang=Math.atan2(aim.y-gy,aim.x-gx);P.ang=ang;
 // boordschutter
 const trig=fire!==false||keys.Space||keys.KeyJ;
 if(reload>0){reload-=dt;if(reload<=0){mag=MAG;beep(500,900,.08,.05)}}
 cd-=dt;
 if(trig&&reload<=0&&mag>0){while(cd<=0){cd+=1/18;
   const a=ang+(Math.random()-.5)*.08;
   bul.push({x:gx+Math.cos(ang)*7,y:gy+Math.sin(ang)*7,vx:Math.cos(a)*340+P.vx*.3,vy:Math.sin(a)*340+P.vy*.3,l:1});
   shells.push({x:gx,y:gy,vx:P.vx*.5-SCROLL+(Math.random()-.5)*30,vy:10+Math.random()*20,l:2});
   shake=Math.max(shake,1);crunch(.04,.1);
   }}
 else if(cd<0)cd=0;
 for(const b of bul){b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;if(b.y>=GROUND){b.dead=1;puff(b.x,GROUND-1,2,['#ff9f43','#8a7a9c'],30)}}
 for(const s of shells){s.vy+=300*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.l-=dt;if(s.y>=GROUND-1){s.y=GROUND-1;s.vy*=-.3;s.vx=-SCROLL}}
 shells=shells.filter(s=>s.l>0&&s.x>-2);if(shells.length>150)shells.splice(0,shells.length-150);
 // golven
 if(banner>0)banner-=dt;
 if(spawnLeft>0){spawnT-=dt;if(spawnT<=0){spawn();spawnLeft--;spawnT=Math.max(.3,1.2-wave*.08)*(.5+Math.random())}}
 else if(!foes.length&&!(bossWave&&banner>0)){nextWave();beep(523,1046,.25,.05,'triangle')}
 // vijanden
 for(const f of foes){f.f+=dt;f.hit=Math.max(0,f.hit-dt);
  if(f.k==='tank'){f.x+=(f.v-SCROLL*.5)*dt;f.cd-=dt;if(f.cd<=0&&f.x<W-4){f.cd=3.2+Math.random()*2;aimShot(f.x+7,f.y-2,65);puff(f.x+7,f.y-2,3,['#ffd56b'],20);beep(180,90,.12,.05)}}
  if(f.k==='jeep'){f.x+=f.v*dt;f.cd-=dt;if(f.cd<=0&&f.x<W-4){f.burst=2;f.cd=4+Math.random()*2}if(f.burst>0&&Math.floor(f.f*10)!==Math.floor((f.f-dt)*10)){f.burst--;aimShot(f.x+5,f.y,85,(Math.random()-.5)*.15);beep(800,400,.04,.03)}}
  if(f.k==='drone'){f.ph+=dt;const tx=P.x+12,ty=P.y+4;const a=Math.atan2(ty-f.y,tx-f.x);f.x+=Math.cos(a)*f.v*dt-SCROLL*.3*dt;f.y+=(Math.sin(a)*f.v*.7+Math.sin(f.ph*5)*20)*dt}
  if(f.k==='boss'){f.ph+=dt;const tx=W-60;f.x+=(tx-f.x)*Math.min(1,dt*.8);f.y=24+Math.sin(f.ph*.7)*22+(P.y-50)*.3;
   f.cd-=dt;if(f.cd<=0&&f.x<W-30){f.mode=(f.mode+1)%2;
    if(f.mode===0){for(let i=-2;i<=2;i++)aimShot(f.x+4,f.y+14,65,i*.16);f.cd=3.2}
    else{f.burst=5;f.cd=3.6}
    beep(220,110,.2,.06)}
   if(f.burst>0&&Math.floor(f.f*6)!==Math.floor((f.f-dt)*6)){f.burst--;aimShot(f.x+4,f.y+14,95,(Math.random()-.5)*.1);crunch(.04,.08)}}
  for(const b of bul){if(!b.dead&&b.x>=f.x&&b.x<=f.x+f.w&&b.y>=f.y&&b.y<=f.y+f.h){b.dead=1;f.hp--;f.hit=.05;puff(b.x,b.y,2,['#ffd56b','#f4e9d8'],40)}}
  if(f.hp<=0&&!f.dead){f.dead=1;combo++;comboT=1.5;score+=f.pts*Math.min(5,1+Math.floor(combo/6));
   const big=f.k==='boss';
   puff(f.x+f.w/2,f.y+f.h/2,big?120:f.k==='tank'?40:18,['#8a7a9c','#5b3a7a','#ff9f43','#ffd56b','#e8466b'],big?160:f.k==='tank'?90:60);
   shake=Math.max(shake,big?14:f.k==='tank'?6:3);crunch(big?1:f.k==='tank'?.35:.15,.3);
   if(big||f.k==='tank'||Math.random()<.06)items.push({k:P.hp<4&&Math.random()<.45?'med':'crate',x:f.x+f.w/2-3,y:f.y,vy:-40,t:9})}
  if(!f.dead&&P.inv<=0&&ov({x:P.x+4,y:P.y+1,w:18,h:7},f)){if(f.k==='drone'){f.dead=1;puff(f.x+5,f.y+2,14,['#e8466b','#ffd56b'])}hurt()}
  if(f.x<-60||f.x>W+80)f.dead=1}
 foes=foes.filter(f=>!f.dead);bul=bul.filter(b=>!b.dead&&b.l>0&&b.x>-4&&b.x<W+4&&b.y>-4);
 for(const s of shots){s.x+=s.vx*dt;s.y+=s.vy*dt;if(ov({x:P.x+5,y:P.y+2,w:16,h:6},{x:s.x-1,y:s.y-1,w:2,h:2})){s.dead=1;hurt()}}
 shots=shots.filter(s=>!s.dead&&s.x>-4&&s.x<W+4&&s.y>-4&&s.y<GROUND);
 // pakketjes hangen aan een parachuutje en drijven mee met de wind
 for(const it of items){it.vy=Math.min(it.vy+200*dt,22);it.y+=it.vy*dt;it.x-=SCROLL*.4*dt;if(it.y>GROUND-5){it.y=GROUND-5;it.x-=SCROLL*.6*dt}it.t-=dt;
  if(ov({x:P.x,y:P.y,w:24,h:9},{x:it.x,y:it.y-4,w:6,h:9})){it.t=0;if(it.k==='med')P.hp=Math.min(4,P.hp+1);else score+=100;beep(660,1320,.15,.05,'triangle')}}
 items=items.filter(i=>i.t>0&&i.x>-8);
 for(const p of parts){p.vy+=160*dt;p.x+=p.vx*dt-SCROLL*.3*dt;p.y+=p.vy*dt;p.l-=dt;if(p.y>GROUND){p.y=GROUND;p.vy*=-.3}}
 parts=parts.filter(p=>p.l>0);
 comboT-=dt;if(comboT<=0)combo=0;
 shake*=Math.pow(.01,dt);
}

function px(x,y,c){g.fillStyle=c;g.fillRect(x|0,y|0,1,1)}
function text(s,x,y,c,al='left',sz=8){g.font=sz+'px "Press Start 2P", monospace';g.textAlign=al;g.textBaseline='top';g.fillStyle='#120d1c';g.fillText(s,x+1,y+1);g.fillStyle=c;g.fillText(s,x,y)}
function blit(img,x,y,flip,sc=1){x=Math.round(x);y=Math.round(y);if(flip){g.save();g.translate(x+img.width*sc,y);g.scale(-1,1);g.drawImage(img,0,0,img.width*sc,img.height*sc);g.restore()}else g.drawImage(img,x,y,img.width*sc,img.height*sc)}
function tiled(img,speed){const o=Math.floor(scrollX*speed)%W;g.drawImage(img,-o,0);g.drawImage(img,W-o,0)}

function drawHeli(x,y,tilt,img,flip,sc=1){
 g.save();g.translate(Math.round(x+12*sc),Math.round(y+5*sc));g.rotate(Math.round(tilt*16)/16);
 blit(img,-12*sc,-5*sc,flip,sc);
 // hoofdrotor
 const f=Math.floor(t*30)%3,len=[22,10,16][f]*sc;g.fillStyle='#8a7a9c';g.fillRect(Math.round(-len/2)+(flip?-1:1)*sc,-6*sc,len,sc);
 // staartrotor
 const tx=flip?11*sc:-12*sc;g.fillStyle='#8a7a9c';if(f===0)g.fillRect(tx,-4*sc,sc,4*sc);else if(f===1)g.fillRect(tx-sc,-2*sc,3*sc,sc);else{g.fillRect(tx-sc,-3*sc,sc,sc);g.fillRect(tx+sc,-1*sc,sc,sc)}
 g.restore();
}

function draw(){
 g.save();
 if(shake>.4)g.translate(Math.round((Math.random()-.5)*shake),Math.round((Math.random()-.5)*shake));
 g.drawImage(sky,0,0);
 g.fillStyle='#5a2150';for(const c of clouds){const x=((c.x-scrollX*.1)%300+300)%300-30;g.fillRect(x|0,c.y,c.w,2);g.fillRect((x|0)+3,c.y-1,c.w-8,1)}
 tiled(far,.25);tiled(near,1);
 for(const s of shells)px(s.x,s.y,'#ffd56b');
 for(const it of items){if(it.t>2||Math.floor(it.t*8)%2){if(it.y<GROUND-5){g.fillStyle='#f4e9d8';g.fillRect((it.x|0)-1,(it.y|0)-6,8,2);px(it.x,it.y-4,'#8a7a9c');px(it.x+5,it.y-4,'#8a7a9c')}blit(SP[it.k],it.x,it.y)}}
 for(const f of foes){
  const fr=Math.floor(f.f*10)%2;
  if(f.k==='boss'){drawHeli(f.x,f.y,-.06,f.hit>0?WHITE.boss:SP.boss,true,2);continue}
  const img=f.k==='drone'?(f.hit>0?WHITE.drone[fr]:SP.drone[fr]):(f.hit>0?WHITE[f.k]:SP[f.k]);
  blit(img,f.x,f.y+(f.k==='jeep'&&fr?-1:0));
  if(f.k==='tank'){const a=Math.atan2(P.y-f.y,P.x-f.x);for(let i=2;i<7;i++)px(f.x+7+Math.cos(a)*i,f.y-1+Math.sin(a)*i,'#8a7a9c');
   g.fillStyle='#2a1f3a';g.fillRect(f.x|0,(f.y|0)-8,14,2);g.fillStyle='#e8466b';g.fillRect(f.x|0,(f.y|0)-8,Math.ceil(14*f.hp/f.max),2)}
 }
 for(const s of shots){g.fillStyle='#e8466b';g.fillRect((s.x|0)-1,(s.y|0)-1,3,3);px(s.x,s.y,'#ffd56b')}
 // heli + boordgeweer
 if(state!=='over'&&P&&(P.inv<=0||Math.floor(P.inv*14)%2)){
  drawHeli(P.x,P.y,P.tilt,SP.heli,false);
  const gx=P.x+15,gy=P.y+8,ca=Math.cos(P.ang||0),sa=Math.sin(P.ang||0);
  for(let i=0;i<7;i++)px(gx+ca*i,gy+sa*i,i<2?'#120d1c':i<6?'#8a7a9c':'#f4e9d8');
  if((fire!==false||keys.Space||keys.KeyJ)&&reload<=0&&mag>0&&state==='play'&&Math.random()<.75){const fx=gx+ca*8,fy=gy+sa*8;g.fillStyle='#ffd56b';g.fillRect((fx|0)-1,(fy|0)-1,3,3);px(fx+ca*2,fy+sa*2,'#ff9f43');px(fx-sa*2,fy+ca*2,'#ff9f43');px(fx+sa*2,fy-ca*2,'#ff9f43')}
 }
 for(const b of bul){px(b.x,b.y,'#ffd56b');px(b.x-b.vx*.008,b.y-b.vy*.008,'#ff9f43')}
 for(const p of parts)if(p.l>.05){g.fillStyle=p.c;g.fillRect(p.x|0,p.y|0,p.l>.3?2:1,p.l>.3?2:1)}
 g.restore();

 if(state==='play'){
  const ax=aim.x|0,ay=aim.y|0;g.fillStyle='#f4e9d8';g.fillRect(ax-4,ay,3,1);g.fillRect(ax+2,ay,3,1);g.fillRect(ax,ay-4,1,3);g.fillRect(ax,ay+2,1,3);
  if(stick){g.fillStyle='rgba(244,233,216,.25)';g.fillRect((stick.ox|0)-10,(stick.oy|0)-10,20,20);g.fillStyle='rgba(244,233,216,.6)';g.fillRect((stick.ox+stick.dx*10|0)-3,(stick.oy+stick.dy*10|0)-3,6,6)}
 }
 if(P){
  for(let i=0;i<4;i++)g.drawImage(i<P.hp?SP.heart:SP.heart0,4+i*7,4);
  text(String(score).padStart(6,'0'),W-4,4,'#f4e9d8','right');
  text('GOLF '+wave,W/2,4,'#8a7a9c','center');
  if(combo>=6)text('x'+Math.min(5,1+Math.floor(combo/6))+' COMBO',W-4,14,'#ff9f43','right');
  const boss=foes.find(f=>f.k==='boss');
  if(boss){g.fillStyle='#2a1f3a';g.fillRect(56,GROUND+6,144,4);g.fillStyle='#e8466b';g.fillRect(56,GROUND+6,Math.ceil(144*boss.hp/boss.max),4);text('GEVECHTSHELI',W/2,GROUND+12,'#e8466b','center')}
 }
 if(state==='play'&&banner>0&&(banner>1||Math.floor(banner*6)%2===0))text(bossWave?'BAAS NADERT':'GOLF '+wave,W/2,48,bossWave?'#e8466b':'#ffd56b','center',16);

 if(state==='title'){
  g.fillStyle='rgba(18,13,28,.72)';g.fillRect(0,0,W,H);
  text('PIXELBULETS',W/2,18,'#ff9f43','center',16);
  text('BOORDSCHUTTER, ONBEPERKT VUUR',W/2,42,'#f4e9d8','center');
  text(touch?'LINKS SLEPEN  VLIEGEN':'WASD  VLIEGEN',W/2,62,'#8a7a9c','center');
  text(touch?'RECHTS TIKKEN  VUREN':'MUIS  RICHTEN + VUREN',W/2,74,'#8a7a9c','center');
  text(touch?'PAKKETJES VANGEN':'P  PAUZE',W/2,86,'#8a7a9c','center');
  if(Math.floor(t*2)%2)text(touch?'TIK OM OP TE STIJGEN':'KLIK OM OP TE STIJGEN',W/2,110,'#ffd56b','center');
  text('RECORD '+best,W/2,128,'#5b3a7a','center');
 }
 if(state==='pause'){g.fillStyle='rgba(18,13,28,.6)';g.fillRect(0,0,W,H);text('PAUZE',W/2,56,'#ffd56b','center',16);text('KLIK OF P',W/2,80,'#8a7a9c','center')}
 if(state==='over'){g.fillStyle='rgba(18,13,28,.66)';g.fillRect(0,0,W,H);text('NEERGESTORT',W/2,34,'#e8466b','center',16);
  text('GOLF '+wave+'   SCORE '+score,W/2,62,'#f4e9d8','center');text(score>=best&&score>0?'NIEUW RECORD!':'RECORD '+best,W/2,78,'#ff9f43','center');
  if(Math.floor(t*2)%2)text('KLIK VOOR NOG EEN VLUCHT',W/2,104,'#ffd56b','center')}
}

reset();state='title';P.x=60;P.y=60;
foes.push({k:'tank',x:170,y:GROUND-6,w:14,h:6,hp:14,max:14,f:0,hit:0},{k:'jeep',x:120,y:GROUND-5,w:10,h:5,hp:5,f:0,hit:0});
let last=0;
let pfHeld = false;
PF.onResume(() => { if (pfHeld) { pfHeld = false; last = performance.now(); requestAnimationFrame(loop); } });
function loop(now){if(PF.paused){pfHeld=true;return}const dt=Math.min(.033,(now-last)/1000||0);last=now;t+=dt;
 if(state==='play')update(dt);
 else if(state==='title'){scrollX+=SCROLL*dt;for(const f of foes)f.f+=dt;P.y=60+Math.sin(t*2)*3}
 else if(state==='over'){scrollX+=SCROLL*dt*.3;for(const p of parts){p.vy+=160*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}parts=parts.filter(p=>p.l>0)}
 draw();requestAnimationFrame(loop)}
(document.fonts?document.fonts.load('8px "Press Start 2P"'):Promise.resolve()).catch(()=>{}).finally(()=>requestAnimationFrame(loop));
})();
</script>
