(() => {
	'use strict';

	const W = 320, H = 180, TS = 8, MW = 40, MH = 18, MY = 16, BY = 160;

	// Op kleine schermen (telefoon) liever zo groot mogelijk dan 1× klein.

		{ naam: 'BLAUW', licht: '#6ec9ff', base: '#2d5d92', speck: '#386fab', donker: '#0e2a4a' },
	];
	const F_TITLE = '16px "Press Start 2P"', F_BIG = '8px "Press Start 2P"', F_HUD = '8px Silkscreen', F_SM = '8px Tiny5';
	function txt(s, x, y, c, f = F_HUD, al = 'left') {
		g.font = f; g.fillStyle = c; g.textAlign = al; g.textBaseline = 'top';
		PF.text(g, s, Math.round(x), Math.round(y));
	}
	function tw(s, f) { g.font = f; return Math.ceil(g.measureText(s).width); }
	function makePat(color) {

	}

		click: () => tone(660, 0.05),
		place: () => tone(520 + Math.random() * 60, 0.05, 'square', 0.03),
		move: () => tone(330, 0.09, 'triangle', 0.08, 0, 80),
		take: () => { tone(523, 0.08); tone(784, 0.1, 'square', 0.04, 0.08); },
		dice: () => { for (let i = 0; i < 4; i++) tone(180 + Math.random() * 320, 0.03, 'square', 0.025, i * 0.06); },
		hit: () => tone(160, 0.12, 'sawtooth', 0.035, 0, -70),
		win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.1, 'square', 0.04, i * 0.09)),
		lose: () => [392, 330, 262].forEach((f, i) => tone(f, 0.14, 'triangle', 0.08, i * 0.12)),
		err: () => tone(110, 0.12, 'square', 0.04),
	};
	PF.onPause(() => { if (ac) ac.suspend(); });
	PF.onResume(() => { if (ac) ac.resume(); });

	// ---------- kansen bij dobbelen (exact uitgerekend) ----------
	// OUT[a][d] = lijst {la, ld, p}: verliezen aanvaller/verdediger in één worp met a en d stenen.
	const OUT = [];
	for (let a = 1; a <= 3; a++) {
		OUT[a] = [];
		for (let d = 1; d <= 2; d++) {
			const cnt = {}; let tot = 0;
			const n = a + d, faces = new Array(n);
			const rec = (k) => {
				if (k === n) {
					const A = faces.slice(0, a).sort((x, y) => y - x), D = faces.slice(a).sort((x, y) => y - x);
					let la = 0, ld = 0;
					for (let i = 0; i < Math.min(a, d); i++) { if (A[i] > D[i]) ld++; else la++; }
					cnt[la + ',' + ld] = (cnt[la + ',' + ld] || 0) + 1; tot++;
					return;
				}
				for (let f = 1; f <= 6; f++) { faces[k] = f; rec(k + 1); }
			};
			rec(0);
			OUT[a][d] = Object.keys(cnt).map((key) => { const [la, ld] = key.split(',').map(Number); return { la, ld, p: cnt[key] / tot }; });
		}
	}
	const MAXU = 100;
	const WP = [], EA = [], ED = [];   // winkans, verwachte overlevers aanvaller, verwachte rest verdediger
	for (let a = 0; a < MAXU; a++) {
		WP[a] = []; EA[a] = []; ED[a] = [];
		for (let d = 0; d < MAXU; d++) {
			if (d === 0) { WP[a][d] = a > 0 ? 1 : 0; EA[a][d] = a; ED[a][d] = 0; continue; }
			if (a === 0) { WP[a][d] = 0; EA[a][d] = 0; ED[a][d] = d; continue; }
			let w = 0, ea = 0, ed = 0;
			for (const o of OUT[Math.min(3, a)][Math.min(2, d)]) {
				const na = a - o.la, nd = d - o.ld;
				w += o.p * WP[na][nd]; ea += o.p * EA[na][nd]; ed += o.p * ED[na][nd];
			}
			WP[a][d] = w; EA[a][d] = ea; ED[a][d] = ed;
		}
	}
	const cap = (n) => Math.max(0, Math.min(MAXU - 1, n));

	// ---------- kaart maken (puntsymmetrisch: eerlijk voor beide kanten) ----------
	function mulberry32(a) {
		return function () {
			a |= 0; a = (a + 0x6D2B79F5) | 0;
			let t = Math.imul(a ^ (a >>> 15), 1 | a);
			t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
			return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
		};
	}
	const N = MW * MH;
	const idx = (x, y) => y * MW + x;
	const mirT = (i) => { const x = i % MW, y = (i / MW) | 0; return idx(MW - 1 - x, MH - 1 - y); };
	function nbrs(i) {
		const x = i % MW, y = (i / MW) | 0, r = [];
		if (x > 0) r.push(i - 1); if (x < MW - 1) r.push(i + 1);
		if (y > 0) r.push(i - MW); if (y < MH - 1) r.push(i + MW);
		return r;
	}
	function genMap(seed) {
		for (let a = 0; a < 200; a++) { const m = tryGen((seed + a * 7919) >>> 0); if (m) return m; }
		throw new Error('geen kaart');
	}
	function tryGen(seed) {
		const rnd = mulberry32(seed);
		const GX = 9, GY = 5, grid = [];
		for (let i = 0; i < GX * GY; i++) grid.push(rnd());
		const nz = (x, y) => {
			const fx = x / (MW - 1) * (GX - 1), fy = y / (MH - 1) * (GY - 1);
			const x0 = Math.floor(fx), y0 = Math.floor(fy), x1 = Math.min(GX - 1, x0 + 1), y1 = Math.min(GY - 1, y0 + 1);
			const tx = fx - x0, ty = fy - y0;
			const a = grid[y0 * GX + x0], b = grid[y0 * GX + x1], c = grid[y1 * GX + x0], d = grid[y1 * GX + x1];
			return (a * (1 - tx) + b * tx) * (1 - ty) + (c * (1 - tx) + d * tx) * ty;
		};
		const land = new Uint8Array(N);
		for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
			const n = (nz(x, y) + nz(MW - 1 - x, MH - 1 - y)) / 2;
			const dx = (x - (MW - 1) / 2) / (MW / 2), dy = (y - (MH - 1) / 2) / (MH / 2);
			const e = Math.pow(Math.abs(dx), 2.4) + Math.pow(Math.abs(dy), 2.4);
			if (e + (n - 0.5) * 1.2 < 0.8) land[idx(x, y)] = 1;
		}
		const lakes = 1 + ((rnd() * 3) | 0);
		for (let k = 0; k < lakes; k++) {
			const lx = 4 + rnd() * 13, ly = 2 + rnd() * (MH - 5), r = 0.9 + rnd() * 1.3;
			for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
				if (Math.hypot(x - lx, (y - ly) * 1.2) < r) { const i = idx(x, y); land[i] = 0; land[mirT(i)] = 0; }
			}
		}
		// alleen het grootste stuk land houden
		const comp = new Int16Array(N).fill(-1);
		let best = -1, bestSize = 0, cid = 0;
		for (let i = 0; i < N; i++) {
			if (!land[i] || comp[i] >= 0) continue;
			let size = 0; const st = [i]; comp[i] = cid;
			while (st.length) { const c = st.pop(); size++; for (const n of nbrs(c)) if (land[n] && comp[n] < 0) { comp[n] = cid; st.push(n); } }
			if (size > bestSize) { bestSize = size; best = cid; }
			cid++;
		}
		let landCount = 0;
		for (let i = 0; i < N; i++) { if (land[i] && comp[i] !== best) land[i] = 0; if (land[i]) landCount++; }
		if (landCount < 380) return null;
		for (let i = 0; i < N; i++) if (land[i] !== land[mirT(i)]) return null;

		// zaadpunten voor de gebieden, steeds in paren (punt + spiegelpunt)
		const landList = []; for (let i = 0; i < N; i++) if (land[i]) landList.push(i);
		const seeds = [];
		for (let tries = 0; seeds.length < 22 && tries < 5000; tries++) {
			const i = landList[(rnd() * landList.length) | 0];
			const x = i % MW, y = (i / MW) | 0;
			if (x >= MW / 2) continue;
			const m = mirT(i);
			if (Math.hypot(x - (m % MW), y - ((m / MW) | 0)) < 4.4) continue;
			let ok = true;
			for (const s of seeds) if (Math.hypot(x - (s % MW), y - ((s / MW) | 0)) < 4.4) { ok = false; break; }
			if (ok) seeds.push(i, m);
		}

		// gebieden laten groeien (kortste pad met ruis): altijd aaneengesloten
		const rt = new Float32Array(N); for (let i = 0; i < N; i++) rt[i] = rnd();
		const wt = (i) => 1 + (rt[i] + rt[mirT(i)]) * 0.8;
		const dist = new Float64Array(N).fill(Infinity), lab = new Int16Array(N).fill(-1), done = new Uint8Array(N);
		seeds.forEach((s, k) => { dist[s] = 0; lab[s] = k; });
		for (;;) {
			let m = -1, md = Infinity;
			for (let i = 0; i < N; i++) if (land[i] && !done[i] && dist[i] < md) { md = dist[i]; m = i; }
			if (m < 0) break;
			done[m] = 1;
			for (const n of nbrs(m)) if (land[n] && !done[n]) {
				const nd = md + (wt(m) + wt(n)) / 2;
				if (nd < dist[n]) { dist[n] = nd; lab[n] = lab[m]; }
			}
		}
		// te kleine gebieden samenvoegen
		const K = seeds.length;
		for (;;) {
			const size = new Array(K).fill(0);
			for (let i = 0; i < N; i++) if (lab[i] >= 0) size[lab[i]]++;
			let sm = -1;
			for (let k = 0; k < K; k++) if (size[k] > 0 && size[k] < 12 && (sm < 0 || size[k] < size[sm])) sm = k;
			if (sm < 0) break;
			const nb = new Set();
			for (let i = 0; i < N; i++) if (lab[i] === sm) for (const n of nbrs(i)) if (lab[n] >= 0 && lab[n] !== sm) nb.add(lab[n]);
			let tgt = -1;
			for (const k of nb) if (tgt < 0 || size[k] < size[tgt]) tgt = k;
			if (tgt < 0) return null;
			for (let i = 0; i < N; i++) if (lab[i] === sm) lab[i] = tgt;
		}
		const remap = new Map(), tiles = new Int16Array(N).fill(-1);
		for (let i = 0; i < N; i++) if (lab[i] >= 0) { if (!remap.has(lab[i])) remap.set(lab[i], remap.size); tiles[i] = remap.get(lab[i]); }
		const R = [];
		for (let r = 0; r < remap.size; r++) R.push({ id: r, tiles: [], adj: new Set(), adjArr: [], cx: 0, cy: 0, bx: 0, by: 0, owner: -1, units: 0, castle: false });
		for (let i = 0; i < N; i++) {
			const r = tiles[i]; if (r < 0) continue;
			R[r].tiles.push(i);
			for (const n of nbrs(i)) if (tiles[n] >= 0 && tiles[n] !== r) R[r].adj.add(tiles[n]);
		}
		if (R.length < 14) return null;
		for (const r of R) {
			r.adjArr = [...r.adj].map((k) => R[k]);
			for (const t of r.tiles) { r.cx += t % MW; r.cy += (t / MW) | 0; }
			r.cx /= r.tiles.length; r.cy /= r.tiles.length;
			let bt = r.tiles[0], bs = Infinity;
			for (const t of r.tiles) {
				const x = t % MW, y = (t / MW) | 0;
				const inR = (xx, yy) => xx >= 0 && yy >= 0 && xx < MW && yy < MH && tiles[idx(xx, yy)] === r.id;
				const s = Math.hypot(x - r.cx, y - r.cy) + (inR(x - 1, y) ? 0 : 1.5) + (inR(x + 1, y) ? 0 : 1.5) + (inR(x, y - 1) ? 0 : 0.5) + (inR(x, y + 1) ? 0 : 0.5);
				if (s < bs) { bs = s; bt = t; }
			}
			r.bx = (bt % MW) * TS + 4; r.by = MY + ((bt / MW) | 0) * TS + 4;
		}
		const mir = R.map((r) => tiles[mirT(r.tiles[0])]);
		for (const r of R) if (mir[r.id] === r.id || mir[mir[r.id]] !== r.id) return null;

		// startgebieden: hoofdstad links + twee buren, gespiegeld voor blauw
		let cap0 = R[0];
		for (const r of R) if (r.cx < cap0.cx) cap0 = r;
		const cap1 = R[mir[cap0.id]];
		const nbs = cap0.adjArr.slice().sort((a, b) => a.cx - b.cx).slice(0, 2);
		if (nbs.length < 2) return null;
		const s0 = [cap0, ...nbs], s1 = s0.map((r) => R[mir[r.id]]);
		for (const a of s0) for (const b of s1) if (a === b || a.adj.has(b.id)) return null;
		for (const r of s0) { r.owner = 0; r.units = START_UNITS; }
		for (const r of s1) { r.owner = 1; r.units = START_UNITS; }
		cap0.castle = cap1.castle = true;
		const d0 = bfs([cap0], R), d1 = bfs([cap1], R);
		const cands = R.filter((r) => r.owner < 0 && d0[r.id] >= 2 && d1[r.id] >= 2 && d0[r.id] < d1[r.id]);
		for (let i = cands.length - 1; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; [cands[i], cands[j]] = [cands[j], cands[i]]; }
		let picked = 0;
		for (const c of cands) {
			if (picked >= 2) break;
			if (c.adjArr.some((n) => n.castle)) continue;

	// ---------- toestand ----------
	let MAP = null, regions = [];
	let scene = 'title';        // title | level | rules | game | over
	let mode = 1, level = 1;    // mode 1 = tegen computer, 2 = twee spelers
	let aiLevel = [-1, 1];      // -1 = mens
	let turn = 0, starter = 0, round = 1, phase = 'place', placeLeft = 0, placeHist = [], steps = STEPS;
	let sel = null, pick = null, battle = null, banner = null, aiShow = null, msg = null, roll = null, over = null;
	let ai = null, aiWait = 0, quitAsk = false, rulesPage = 0;
	let T = 0, mapDirty = true, cursorR = 0, lastInput = 'ptr', menuFocus = 0;
	let fx = [];
	let SIM = false, simResult = null;
	let rec = PF.store.get('rec', [0, 0, 0]);

	const isAI = (p) => aiLevel[p] >= 0;
	const own = (p) => regions.filter((r) => r.owner === p);
	const landOf = (p) => own(p).length;
	const unitsOf = (p) => own(p).reduce((s, r) => s + r.units, 0);
	const castlesOf = (p) => own(p).filter((r) => r.castle).length;

	function aiBestAction(p) {

	// ---------- test: computer tegen computer (alleen met ?debug) ----------

	// Eén "tik" in het spel: r = gebied, null = water, undefined = buiten de kaart.

	function update(dt) {
		T += dt;

		for (const f of fx) f.t += dt;
		fx = fx.filter((f) => f.t < 1);
		if (scene !== 'game' || quitAsk) return;
		if (phase === 'roll') { roll.t += dt; if (roll.t > 3.2) firstTurn(); return; }
		if (banner && (banner.t -= dt) <= 0) banner = null;
		if (battle) updateBattle(dt);
		if (ai) {
			aiWait -= dt;
			if (aiWait <= 0) {
				const gen = ai, r = gen.next();

			const nb = [[-1, 0], [1, 0], [0, -1], [0, 1]];

	function pixLine(x0, y0, x1, y1, c) {
		const pts = [];
		let dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1, dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1, err = dx + dy;
		for (;;) {
			pts.push([x0, y0]);
			if (x0 === x1 && y0 === y1) break;
			const e2 = 2 * err;
			if (e2 >= dy) { err += dy; x0 += sx; }
			if (e2 <= dx) { err += dx; y0 += sy; }
		}
		g.fillStyle = C.zwart;
		for (const [x, y] of pts) g.fillRect(x - 1, y - 1, 3, 3);
		g.fillStyle = c;

		const col = o.w < 0 ? C.wit : TEAM[o.w].licht;
		box(60, 30, 200, 116, col);
		const title = o.w < 0 ? 'GELIJKSPEL' : mode === 1 ? (o.w === 0 ? 'JIJ WINT!' : 'COMPUTER WINT') : TEAM[o.w].naam + ' WINT!';
		txt(title, W / 2, 40, col, F_BIG, 'center');
		txt(o.why === 'alles' ? 'Al het land veroverd!' : 'Na ' + MAXR + ' rondes telt het land.', W / 2, 54, C.lgrijs, F_SM, 'center');
		txt(teamName(0) + ' ' + landOf(0) + ' land', 120, 68, TEAM[0].licht, F_SM, 'center');
		txt(teamName(1) + ' ' + landOf(1) + ' land', 200, 68, TEAM[1].licht, F_SM, 'center');
		if (o.score !== null) {
			txt(o.score + ' punten', W / 2, 82, C.geel, F_BIG, 'center');
			txt(o.newRec ? 'nieuw record!' : 'record ' + rec[level], W / 2, 94, o.newRec ? C.groen : C.grijs, F_SM, 'center');
		}
		button('again', 'NOG EEN KEER', 80, 112, 90, 15, { nav: true });
		button('toMenu', 'MENU', 180, 112, 60, 15, { nav: true });
	}

	function newTitleMap() { MAP = genMap((Math.random() * 4294967296) >>> 0); regions = MAP.regions; mapDirty = true; }
	newTitleMap();
	PF.fonts(['Press Start 2P', 'Silkscreen', 'Tiny5']).then(() => PF.loop(update, { fps: 30, draw }));
})();
</script>
