function typeOf(id) { return id === 0 ? 'cue' : id === 8 ? 'eight' : id < 8 ? 'solid' : 'stripe'; }

  for (i = 0; i < n; i++) { b = bs[i]; if (!b.on) continue; b.x += b.vx * DT; b.y += b.vy * DT; }

    else if (b.x > FX1 - R) { b.x = FX1 - R; if (b.vx > 0) { if (ev.snd && b.vx > 30) ev.snd.push(['wall']); b.vx = -b.vx * E_WALL; } }

/* ---------- toestand ---------- */

var banner = null, over = null, cpu = null, time = 0, scoreSent = false;

  { name: 'GEMIDDELD', sd: 0.028, fsd: 0.04, psd: 0.08, maxC: 6, miss: 0.2, sloppy: false, smart: true, step: 12, extra: false },
  { name: 'MOEILIJK', sd: 0.004, fsd: 0.01, psd: 0.015, maxC: 30, miss: 0, sloppy: false, smart: true, step: 8, extra: true }

function cpuLevel() { return (TEST && TEST.levels) ? TEST.levels[cur] : level; }
var TEST = (typeof __POOL_TEST !== 'undefined') ? __POOL_TEST : null;

function isCpu() { return (mode === 'cpu' && cur === 1) || !!(TEST && TEST.both && mode !== 'solo'); }

  arr[0] = { id: 0, x: HEADX, y: MY, vx: 0, vy: 0, on: true };

  for (var row = 0; row < 5; row++) {

function validPlace(x, y) {

  for (var i = 1; i < 16; i++) {
    var b = balls[i]; if (!b.on) continue;
    var dx = b.x - x, dy = b.y - y;

    var x = HEADX + Math.cos(a) * r, y = MY + Math.sin(a) * r;

    var t = typeOf(i);

    c.x = pos.x; c.y = pos.y; c.vx = 0; c.vy = 0; c.on = true;

  if (ev.cue) { r.foul = true; r.reason = 'KEUBAL IN HET GAT'; }

  else {
    var t = typeOf(ev.first);
    if (me) { var need = cleared ? 'eight' : me; if (t !== need) { r.foul = true; r.reason = 'VERKEERDE BAL GERAAKT'; } }

    var tg = targets[Math.floor(Math.random() * targets.length)];

var MASK = ['..XXXX..', '.XXXXXX.', 'XXXXXXXX', 'XXXXXXXX', 'XXXXXXXX', 'XXXXXXXX', '.XXXXXX.', '..XXXX..'];

function mk() { var c = document.createElement('canvas'); c.width = 8; c.height = 8; return c; }
function buildSprites() {
  var id, x, y;
  for (id = 0; id < 16; id++) {
    var c = mk(), g = c.getContext('2d');
    for (y = 0; y < 8; y++) for (x = 0; x < 8; x++) {
      if (MASK[y][x] !== 'X') continue;
      var col;
      if (id === 0) col = C.white;

      else {
        var base = BC[id > 8 ? id - 8 : id];
        col = (id > 8 && (y < 2 || y > 5)) ? C.white : base;

      g.fillStyle = col; g.fillRect(x, y, 1, 1);
    }
    if (id > 0) { g.fillStyle = C.white; g.fillRect(3, 3, 2, 2); }
    else { g.fillStyle = C.lgray; g.fillRect(5, 5, 1, 1); g.fillRect(4, 6, 1, 1); g.fillRect(6, 4, 1, 1); }
    SPR[id] = c;
  }
  SHADOW = mk(); var sg = SHADOW.getContext('2d'); sg.fillStyle = C.shadow;
  for (y = 0; y < 8; y++) for (x = 0; x < 8; x++) if (MASK[y][x] === 'X') sg.fillRect(x, y, 1, 1);
  RING = mk(); var rg = RING.getContext('2d'); rg.fillStyle = C.white;
  for (y = 0; y < 8; y++) for (x = 0; x < 8; x++) {
    if (MASK[y][x] !== 'X') continue;
    var edge = false, nb = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    for (var k = 0; k < 4; k++) {
      var xx = x + nb[k][0], yy = y + nb[k][1];

}

function rayCast(ox, oy, dx, dy) {

  else if (dx < -1e-6) { t = (FX0 + R - ox) / dx; if (t > 0 && t < best) { best = t; hit = null; } }
  if (dy > 1e-6) { t = (FY1 - R - oy) / dy; if (t > 0 && t < best) { best = t; hit = null; } }
  else if (dy < -1e-6) { t = (FY0 + R - oy) / dy; if (t > 0 && t < best) { best = t; hit = null; } }

  getButtons().forEach(function (b) { if (state === 'aim' || state === 'place' || state === 'roll' || state === 'banner') drawButton(b, false); });
  if (state === 'banner' && banner) drawBannerBox();
  if (state === 'pause') { drawPanel(90, 56, 140, 72); T('PAUZE', W / 2, 62, C.yellow, F_P8, 'center'); getButtons().forEach(function (b) { drawButton(b, false); }); }
  if (state === 'over') drawOver();
}

/* ---------- update ---------- */
function update(dt) {
  time += dt;
  if (state === 'roll') {
    shot.acc += dt; shot.t += dt;
    var n = 0;
    while (shot.acc >= DT && n < 24) { step(balls, shot.ev); shot.acc -= DT; n++; }
    if (shot.ev.snd.length) playSounds(shot.ev.snd);
    if (stopped(balls) || shot.t > 30) endRoll();
  } else if (state === 'aim') {
    if (isCpu()) {
      if (cpu) {
        cpu.t += dt; var pl = cpu.plan;
        aim.angle = pl.angle;
        aim.power = pl.power * clamp((cpu.t - 0.7) / 0.6, 0, 1);
        if (cpu.t >= 1.5) shoot(pl.angle, pl.power);
      }
    } else if (!aim.drag) {
      var rot = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0);
      if (rot) aim.angle += rot * dt * (keys.Shift ? 0.3 : 1.4);
      if (charging && keys[' ']) aim.power = Math.min(1, aim.power + dt * 0.7);
    }
  } else if (state === 'place') {
    var mx = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0), my = (keys.ArrowDown ? 1 : 0) - (keys.ArrowUp ? 1 : 0);
    if ((mx || my) && !placing) {
      var c = balls[0], sp = dt * (keys.Shift ? 20 : 70);
      c.x = clamp(c.x + mx * sp, FX0 + R, FX1 - R); c.y = clamp(c.y + my * sp, FY0 + R, FY1 - R);
    }
  } else if (state === 'banner' && banner) {
    banner.t += dt; if (banner.t >= banner.dur) skipBanner();
  }
}

/* ---------- menu / pauze ---------- */
function toMenu() { state = 'menu'; banner = null; over = null; }
function pauseGame() { if (state === 'over' || state === 'menu' || state === 'level') return; prevState = state; state = 'pause'; aim.drag = false; placing = false; }
function resumeGame() { state = prevState; }

/* ---------- invoer ---------- */
function toGame(e) {
  var r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
function hitButton(x, y) {
  var bs = getButtons();
  for (var i = 0; i < bs.length; i++) { var b = bs[i]; if (x >= b.x && x < b.x + b.w && y >= b.y && y < b.y + b.h) return b; }
  return null;
}
function updateDrag(x, y) {
  var c = balls[0], dx = c.x - x, dy = c.y - y, d = Math.hypot(dx, dy);
  if (d > 3) aim.angle = Math.atan2(dy, dx);
  aim.power = clamp((d - 6) / 64, 0, 1);
}
function movePlace(x, y) {
  var c = balls[0];
  c.x = clamp(x, FX0 + R, FX1 - R); c.y = clamp(y, FY0 + R, FY1 - R);
}
function confirmPlace() {
  var c = balls[0];
  if (!validPlace(c.x, c.y)) return;
  inHand = false; state = 'aim';
  var tg = legalTargets(cur), bd = 1e9;
  for (var i = 0; i < tg.length; i++) {
    var d = Math.hypot(tg[i].x - c.x, tg[i].y - c.y);
    if (d < bd) { bd = d; aim.angle = Math.atan2(tg[i].y - c.y, tg[i].x - c.x); }
  }
}

function onDown(x, y) {
  var b = hitButton(x, y);
  if (b) { b.act(); return; }
  if (state === 'banner') { skipBanner(); return; }
  if (state === 'aim' && !isCpu()) { aim.drag = true; updateDrag(x, y); }
  else if (state === 'place') { placing = true; movePlace(x, y); }
}
function onMove(x, y) {
  if (state === 'menu' || state === 'level') { var b = hitButton(x, y); if (b && b.idx !== undefined) sel = b.idx; return; }
  if (aim.drag && state === 'aim') updateDrag(x, y);
  else if (placing && state === 'place') movePlace(x, y);
}
function onUp() {
  if (aim.drag) {
    aim.drag = false;
    if (state === 'aim' && aim.power > 0.05) shoot(aim.angle, aim.power); else aim.power = 0;
  }
  if (placing) { placing = false; if (state === 'place') confirmPlace(); }
}

cv.addEventListener('pointerdown', function (e) {
  e.preventDefault(); initAudio();
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  var p = toGame(e); onDown(p.x, p.y);
});
cv.addEventListener('pointermove', function (e) { var p = toGame(e); onMove(p.x, p.y); });
cv.addEventListener('pointerup', function (e) { e.preventDefault(); onUp(); });
cv.addEventListener('pointercancel', function () { aim.drag = false; placing = false; aim.power = 0; });
document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

window.addEventListener('keydown', function (e) {
  var k = e.key; initAudio();
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].indexOf(k) >= 0) e.preventDefault();
  var first = !keys[k]; keys[k] = true;
  if (state === 'menu' || state === 'level') {
    var nb = getButtons().length;
    if (k === 'ArrowUp') sel = (sel + nb - 1) % nb;
    else if (k === 'ArrowDown') sel = (sel + 1) % nb;
    else if (k === 'Enter' || k === ' ') { var b = getButtons()[sel]; if (b) b.act(); }
    else if (k === 'Escape') { if (state === 'level') { state = 'menu'; sel = 1; } else if (PF.inSite) PF.back(); }
    return;
  }
  if (k === 'Escape' || k === 'p' || k === 'P') { if (state === 'pause') resumeGame(); else pauseGame(); return; }
  if (state === 'pause') { if (k === 'Enter') resumeGame(); return; }
  if (state === 'over') { if (k === 'Enter') newGame(mode); return; }
  if (state === 'banner') { if (k === 'Enter' || k === ' ') skipBanner(); return; }
  if (state === 'place' && (k === 'Enter' || k === ' ') && first) { confirmPlace(); return; }
  if (state === 'aim' && !isCpu() && k === ' ' && first) { charging = true; aim.power = 0; }
});
window.addEventListener('keyup', function (e) {
  var k = e.key; keys[k] = false;
  if (k === ' ' && charging) {
    charging = false;
    if (state === 'aim' && !isCpu() && aim.power > 0.05) shoot(aim.angle, aim.power); else aim.power = 0;
  }
});
window.addEventListener('blur', function () { keys = {}; charging = false; aim.drag = false; placing = false; });

/* ---------- start ---------- */
var started = false;
function start() {
  if (started) return; started = true;
  PF.loop(update, { draw: draw });
}
if (TEST) {
  TEST.api = {
    newGame: newGame, update: update, step: step, simulate: simulate, judge: judge, makeRack: makeRack,
    get: function () { return { state: state, balls: balls, group: group, cur: cur, strokes: strokes, over: over, mode: mode, inHand: inHand }; },
    draw: draw, stopped: stopped, setBalls: function (b) { balls = b; }, shoot: shoot, startTurn: startTurn,
    setCur: function (c) { cur = c; }, cpuPlan: cpuPlan, getButtons: getButtons, onDown: onDown, onUp: onUp, onMove: onMove, aim: aim,
    validPlace: validPlace, setLevel: function (l) { level = l; }
  };
}
Promise.resolve(PF.fonts(['Press Start 2P', 'Silkscreen'])).then(start, start);
})();
</script>
</body>
